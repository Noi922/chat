<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Chat</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-6z"/><path d="M11 14l9-10"/></symbol>
  <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 007 0"/><path d="M9 9.5v.5M15 9.5v.5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5.5-5 3.5 3 3-2.5 4 4"/></symbol>
  <symbol id="i-reply" viewBox="0 0 24 24"><path d="M10 7L5 12l5 5"/><path d="M5 12h9a5 5 0 015 5v1"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 000-16z" fill="currentColor"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6L7 10z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0112 0v6l1.5 2h-15z"/><path d="M10 21h4"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H5v16h5M15 8l4 4-4 4M9 12h10"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.500 9.500a2.500 2.500 0 114 2c-.9.600-1.500 1.200-1.500 2.300"/><path d="M12 17v.2"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
</svg>

<!-- Anmeldung -->
<section id="login" class="login">
  <form id="loginForm" class="login-card" novalidate>
    <div class="logo" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1 id="loginTitle">Chat</h1>
    <p class="login-sub">Wähle einen Namen und einen Raum. Ein neuer Raumname erstellt automatisch einen neuen Raum.</p>
    <label>Name
      <input id="loginName" maxlength="20" autocomplete="nickname" spellcheck="false" placeholder="z. B. Anna">
    </label>
    <label>Raum
      <input id="loginRoom" maxlength="30" spellcheck="false" autocapitalize="none" placeholder="lobby">
    </label>
    <p class="form-error" id="loginError" role="alert"></p>
    <button type="submit" class="btn-primary" id="loginButton">Beitreten</button>
    <a class="login-help" href="/anleitung.html">Wie funktioniert der Chat? Zur Anleitung</a>
  </form>
</section>

<!-- Chat -->
<div id="app" class="app" hidden>
  <div id="backdrop" class="backdrop" hidden></div>

  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="logo small" aria-hidden="true"><span></span><span></span><span></span></div>
      <strong id="brandName">Chat</strong>
    </div>

    <nav class="side-scroll">
      <h2>Räume</h2>
      <ul id="roomList" class="room-list"></ul>
      <form id="newRoomForm" class="new-room">
        <input id="newRoom" maxlength="30" placeholder="Neuer Raum …" aria-label="Neuen Raum erstellen" spellcheck="false" autocapitalize="none">
        <button type="submit" class="icon-btn" title="Raum erstellen" aria-label="Raum erstellen"><svg class="icon"><use href="#i-plus"/></svg></button>
      </form>

      <h2>Online <span id="userCount" class="count"></span></h2>
      <ul id="userList" class="user-list"></ul>
    </nav>

    <div class="me">
      <div id="meAvatar" class="avatar"></div>
      <div class="me-name">
        <strong id="meName"></strong>
        <span id="meRole"></span>
      </div>
      <button class="icon-btn" id="themeBtn" type="button"><svg class="icon"><use href="#i-theme"/></svg></button>
      <button class="icon-btn" id="soundBtn" type="button"><svg class="icon"><use href="#i-sound"/></svg></button>
      <button class="icon-btn" id="notifyBtn" type="button"><svg class="icon"><use href="#i-bell"/></svg></button>
      <button class="icon-btn" id="logoutBtn" type="button" title="Abmelden" aria-label="Abmelden"><svg class="icon"><use href="#i-logout"/></svg></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Räume und Personen anzeigen"><svg class="icon"><use href="#i-menu"/></svg></button>
      <div class="room-head">
        <strong id="roomTitle"></strong>
        <button id="roomTopic" class="topic" type="button" title="Thema ändern"></button>
      </div>
      <span id="connection" class="connection" hidden>Verbindung getrennt – verbinde neu …</span>
      <a class="icon-btn" href="/anleitung.html" target="_blank" rel="noopener" title="Anleitung" aria-label="Anleitung öffnen"><svg class="icon"><use href="#i-help"/></svg></a>
    </header>

    <div class="scroll-wrap">
      <div id="messages" class="messages" aria-live="polite">
        <button id="loadMore" class="load-more" type="button" hidden>Ältere Nachrichten laden</button>
        <div id="messageList"></div>
      </div>
      <button id="jumpBtn" class="jump" type="button" hidden><svg class="icon"><use href="#i-down"/></svg><span>Neue Nachrichten</span></button>
      <div id="dropHint" class="drop-hint" hidden>Bild hier ablegen</div>
    </div>

    <div id="typing" class="typing" aria-live="polite"></div>

    <footer class="composer-wrap">
      <p class="form-error" id="chatError" role="alert"></p>
      <div id="contextBar" class="context" hidden>
        <div class="context-text"><b id="contextLabel"></b> <span id="contextText"></span></div>
        <button class="icon-btn" id="contextCancel" type="button" aria-label="Abbrechen"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div id="emojiPicker" class="emoji-picker" hidden></div>
      <form id="composer" class="composer">
        <button class="icon-btn" id="attachBtn" type="button" title="Bild senden" aria-label="Bild senden"><svg class="icon"><use href="#i-image"/></svg></button>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
        <textarea id="input" rows="1" placeholder="Nachricht schreiben … (/help für Befehle)" aria-label="Nachricht"></textarea>
        <button class="icon-btn" id="emojiBtn" type="button" title="Emoji" aria-label="Emoji einfügen"><svg class="icon"><use href="#i-smile"/></svg></button>
        <button class="send-btn" type="submit" title="Senden" aria-label="Senden"><svg class="icon"><use href="#i-send"/></svg></button>
      </form>
    </footer>
  </main>
</div>

<div id="lightbox" class="lightbox" hidden><img alt=""></div>

<script src="/app.js"></script>
</body>
</html>
