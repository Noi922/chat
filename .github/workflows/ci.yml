name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chat-server .
      - name: Container starten und Healthcheck prüfen
        run: |
          docker run -d --name chat -p 3000:3000 chat-server
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/healthz && exit 0
            sleep 1
          done
          docker logs chat
          exit 1
